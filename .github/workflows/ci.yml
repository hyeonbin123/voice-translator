# push(main)와 PR마다 도는 검사. Actions 탭의 'Run workflow'로 손으로도 돌릴 수 있다(workflow_dispatch). 네 작업은 서로
# 기다리지 않고 나란히 돈다.
# - backend: 린트·포맷 확인, 실제 PostgreSQL로 pytest, 마이그레이션
# - frontend: 린트, Vitest 단위 테스트, 빌드
# - e2e: 실제 브라우저(Chromium)로 접근성·키보드·좁은 화면 검사(npm run test:a11y)
# - audit: 알려진 취약점이 있는 의존성 찾기(pip-audit, npm audit). 지금은 보고만 한다(아래 설명)
# 명령은 README 테스트 절과 같다. GPU·모델이 필요한 측정은 CI에서 돌리지 않는다(LOAD_MODELS=false).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 손으로 돌리기: push 없이 audit 작업이 새 권고를 다시 보게 할 때 쓴다(저장소가 쉬는 동안 공개된 권고는 다음
  # push까지 드러나지 않는다). 주기 실행(schedule)은 저장소에 지속 설정을 두는 일이라 넣지 않았다.
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    # 테스트는 이 DB 서버에 테스트마다 vt_test_<임의 문자열> DB를 만들어 쓰고 지운다(backend/tests/conftest.py).
    # 포트는 로컬 compose와 같은 55442로 맞춰 DATABASE_URL 기본값을 그대로 쓴다.
    services:
      postgres:
        # docker-compose.yml과 같은 이미지(digest 고정, PostgreSQL 16.15).
        image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_USER: vtuser
          POSTGRES_PASSWORD: vtpass
          POSTGRES_DB: voicetranslator
        ports:
          - 55442:5432
        options: >-
          --health-cmd "pg_isready -U vtuser -d voicetranslator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      UV_PYTHON: "3.11"
      DATABASE_URL: postgresql+asyncpg://vtuser:vtpass@127.0.0.1:55442/voicetranslator
    steps:
      - uses: actions/checkout@v7

      # setup-uv는 떠다니는 주 판 태그(v10 같은)를 내지 않아 정확한 릴리스로 고정한다.
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      # --locked: 이미지 빌드(backend/Dockerfile)와 같다. uv.lock이 pyproject.toml과 어긋나면 옛 고정 판으로
      # 테스트하지 않고 바로 실패한다.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      # 포맷이 다른 파일이 있으면 실패한다(고치지 않고 보기만). 로컬에서는 `uv run ruff format .`으로 맞춘다.
      - name: Check formatting
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest -q

      # 위 실행은 아래 테스트들을 건너뛴다: eval 그룹의 sacrebleu·jiwer·pyarrow가 필요한데, eval 그룹 전체는
      # torch까지 끌어와 무겁다. 그래서 세 패키지만 uv.lock과 같은 판으로 얹어 이 테스트도 돌게 한다.
      # - test_mt_decide·test_significance_corpus·test_reanalysis: sacrebleu·jiwer가 필요하다.
      # - test_mbr: MBR 디코딩 시험 도구(eval/mbr.py)의 효용이 sacrebleu 문장 chrF와 같은지와 판정 규칙을 보고,
      #   측정 팔을 만드는 eval.mt_eval을 불러온다(그 모듈은 머리에서 sacrebleu와 pyarrow.parquet를 import한다).
      # - test_register_eval: 말투 후처리 시험 도구(eval/register_eval.py)의 판정이 sacrebleu chrF·spBLEU를 쓰고,
      #   COMET 키를 eval.reanalysis(머리에서 jiwer·sacrebleu를 import)에서 가져온다.
      # - test_mbr_service: 서비스 안의 문장 chrF(app/services/mbr.py, 표준 라이브러리만)가 sacrebleu 공개 함수와
      #   측정 도구 eval/mbr.py와 끝자리까지 같은지, MBR 고르기가 측정 도구와 같은 후보를 고르는지 본다(20절 채택
      #   반영). 가짜 효용 표로 돌아가는 나머지 테스트는 위 Test 단계에서도 돈다.
      # - test_ort_swap_check: 교체 점검 도구(eval/ort_swap_check.py)가 복사해 둔 무음·잡음 입력이
      #   eval/stt_eval.py의 것과 바이트까지 같은지 보는 테스트가 eval.stt_eval을 불러온다. 그 모듈은 머리에서
      #   jiwer와 pyarrow.parquet를 import하므로(나머지 faster-whisper·av·numpy는 주 의존성) 위 실행에서는 이
      #   테스트만 조용히 건너뛰었다. 나머지 테스트는 위에서도 돌지만 파일 단위로 함께 다시 돌린다(몇 초).
      # -rs는 건너뛴 테스트와 이유를 로그에 남긴다. 여기서 건너뜀이 보이면 얹을 패키지가 빠진 것이다.
      - name: Test the evaluation tools that need sacrebleu, jiwer and pyarrow
        run: >-
          uv run --with sacrebleu==2.6.0 --with jiwer==4.0.0 --with pyarrow==25.0.1
          pytest -q -rs tests/test_mt_decide.py tests/test_significance_corpus.py tests/test_reanalysis.py
          tests/test_ort_swap_check.py tests/test_mbr.py tests/test_register_eval.py tests/test_mbr_service.py

      # MeloTTS 한국어 전처리(g2pkk)의 정규식 캐시(app/services/tts.py _cache_g2pkk_regex)를 켜기 전후로 실제
      # g2pkk의 출력이 같은지 보는 테스트는 맨 위 Test 단계에서 건너뛴다: g2pkk와 형태소 분석기(python-mecab-ko와
      # 그 사전)는 tts 그룹에만 있는데, tts 그룹 전체는 torch·MeloTTS까지 끌어와 무겁다. 그래서 g2pkk와 그 의존성만
      # uv.lock과 같은 판으로 얹어 이 파일만 돌린다. g2pkk는 import할 때 NLTK cmudict가 없으면 내려받으므로(약
      # 1MB, ~/nltk_data) 받은 것을 캐시해 실행마다 다시 받지 않는다. -rs로 건너뜀이 0인지 로그에서 본다.
      - name: Cache the NLTK cmudict that g2pkk downloads
        uses: actions/cache@v6
        with:
          path: ~/nltk_data
          key: nltk-cmudict-${{ runner.os }}-nltk-3.10.3

      - name: Test the g2pkk regex cache against the real g2pkk
        run: >-
          uv run --with g2pkk==0.1.2 --with python-mecab-ko==1.3.7 --with python-mecab-ko-dic==2.1.1.post2
          --with jamo==0.4.1 --with nltk==3.10.3 pytest -q -rs tests/test_g2pkk_regex_cache.py

      # 영→한 말투 후처리(app/services/register.py, KO_REGISTER=formal)를 실제 형태소 분석기로 보는 테스트(실제
      # 문장의 활용·그대로 두는 경우·멱등)는 맨 위 Test 단계에서 건너뛴다: 분석기 python-mecab-ko와 그 사전은 tts
      # 그룹에만 있다. 두 패키지만 uv.lock과 같은 판으로 얹어 이 파일을 다시 돌린다(가짜 형태소 열 테스트는 위에서도
      # 돈다). -rs로 건너뜀이 0인지 로그에서 본다.
      - name: Test the formal register rules against the real morphological analyzer
        run: >-
          uv run --with python-mecab-ko==1.3.7 --with python-mecab-ko-dic==2.1.1.post2
          pytest -q -rs tests/test_register.py

      - name: Migrate development database
        run: uv run alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # 실제 브라우저 검사(frontend/e2e/accessibility.spec.ts, 8개). 화면을 Vite 개발 서버로 띄우고 API·웹소켓·마이크는
  # 검사 파일이 가짜로 답한다. CI에 넣은 이유: 대화 모드를 웹소켓으로 바꾼 커밋 뒤 이 검사 2개가 깨졌는데 CI가
  # 돌리지 않아 열흘 동안 몰랐다.
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # 빈 값이면 playwright.config.ts가 채널을 주지 않아 Playwright가 받아 둔 Chromium으로 돈다. 로컬 기본값인
      # Microsoft Edge는 Linux 러너에 없고, 실행마다 설치하면 캐시할 수 없어 느리다.
      PLAYWRIGHT_CHANNEL: ""
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # 브라우저 내려받기(~/.cache/ms-playwright)는 Playwright 판마다 캐시한다. 판이 같으면 브라우저는 다시 받지
      # 않고, 러너에 없는 시스템 라이브러리만 설치한다(이 부분은 러너 밖에 설치돼 캐시할 수 없다).
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(npx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browsers
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Chromium and its system libraries
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install the system libraries for the cached Chromium
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Accessibility and keyboard checks in a real browser
        run: npm run test:a11y

      # 실패하면 스크린샷·trace(playwright.config.ts의 outputDir)를 올려 원인을 볼 수 있게 한다.
      - name: Keep the failure screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: work/round11-browser
          retention-days: 7

  # 알려진 취약점 검사(docs/security.md '의존성 취약점'). 처음에는 보고만 한다(continue-on-error): 새 권고가
  # 공개되는 날 코드와 상관없는 push가 막히지 않게 하려는 것이다. 실패하면 이 작업만 빨간색으로 남고 워크플로는
  # 통과하므로, 실패를 보면 docs/security.md에 판단을 적고 고치거나 받아들일 목록에 더한다.
  # - Python은 uv.lock에 잠긴 모든 패키지를 대조한다(2026-11-07부터). 서버 환경(gpu + tts 그룹)과 도구 환경(gpu +
  #   eval + dev 그룹)을 따로 내보내 합친다 — 두 그룹(tts·eval)은 함께 설치할 수 없어 한 번에 내보낼 수 없지만, 둘을
  #   합치면 잠금의 모든 그룹이다. 내보낸 줄의 환경 표지(`; python_full_version >= '3.13'` 따위)는 뗀다: pip-audit은
  #   표지를 자기를 돌리는 파이썬(이 러너의 3.11, Linux)으로 판단해 맞지 않는 줄을 말없이 건너뛰므로, 표지를 두면
  #   Python 3.13 이상의 갈래(audioop-lts·standard-aifc 등), Windows 전용 판(tzdata·win32-setctime), 설치하지 않는
  #   unidic·plac, 그리고 도구 환경의 둘째 numpy 판이 어느 대조에도 들지 않았다(2026-11-07 확인: 잠금 257개 가운데
  #   243개만 대조). torch·torchaudio의 로컬 판 표시(`+cu128`)도 떼어 PyPI의 같은 판으로 대조한다(그대로 두면 'not
  #   found on PyPI'로 건너뜀). 같은 이름이 판을 달리해 또 나오면(numpy 1.26.4·2.4.6·2.5.3, torch 2.11.0·2.14.0,
  #   setuptools 81.0.0·84.2.1 등) pip-audit이 한 목록 안의 같은 이름을 거절하므로 둘째 판부터는 다음 목록(audit-2,
  #   audit-3)으로 나눈다. --strict는 대조하지 못한 패키지가 하나라도 있으면 실패로 본다. 내보낸 (이름, 판) 수가
  #   잠금의 패키지 수에서 아래 셋을 뺀 값과 다르면 대조 범위가 빠진 것이므로 멈춘다
  # - 대조하지 않는 셋: 프로젝트 자신(--no-emit-project), MeloTTS(PyPI에 없는 git 의존성), transformers 4.27.4(MeloTTS가
  #   고정한 판이라 올릴 수 없고 권고 30건을 받아들인 위험으로 적음 — 고정된 공개 모델만 읽음. 도구 환경의 transformers
  #   5.17.0은 대조한다). MeloTTS가 선언만 하고 서버가 쓰지 않는 gradio·tensorboard는 pyproject의
  #   exclude-dependencies로 잠금에서 뺐으므로(2026-10-24, 그 밑의 pillow·brotli 등 15개도 함께) 여기 목록에도 없다.
  #   tests/test_lock_hygiene.py가 지킨다
  # - 목록마다 두 권고 데이터베이스와 대조한다: pip-audit 기본값인 PyPI의 권고 정보와 OSV. 2026-11-07에 OSV에만 있던
  #   권고 둘(mako 1.4.1의 PYSEC-2026-4243, nltk 3.10.3의 GHSA-j456-xh4h-cpf2)이 PyPI 쪽 검사에는 나오지 않았다
  # - 고칠 판이 없거나 올릴 수 없거나 이 서비스와 상관없는 권고는 ID로 제외한다(판단은 docs/security.md '의존성
  #   취약점'): PYSEC-2026-3740·GHSA-j456-xh4h-cpf2(nltk 3.10.3: 모델 저장·읽기 API와 WekaClassifier의 경로. 서비스는
  #   MeloTTS 전처리가 이미지에 넣은 데이터만 읽고 그 API를 부르지 않는다. 고친 판 3.10.4는 합성 전처리의 측정 경로라
  #   동일성 관문 뒤에 올린다), PYSEC-2026-3447(setuptools, macOS에서 sdist를 만들 때만 해당), GHSA-xmj3-9gf7-h52w(setuptools
  #   84.1.0 미만: Windows에서 옛 egg 방식으로 조작된 wheel을 설치할 때만 해당. 서버 환경에만 남는다 — torch cu128이
  #   setuptools<82를 요구하고 MeloTTS의 중국어 전처리(cn2an·jieba)가 pkg_resources를 써서 올릴 수 없음. 도구 환경은
  #   eval 그룹의 하한으로 84.1.0 이상), PYSEC-2025-194(torch 2.11.0: 서비스가 부르지 않는 torch.jit.script의 메모리
  #   손상. 로컬 판 표시를 떼면서 대조 대상이 됐다. tts 그룹의 고정 판이라 올리지 않는다). filelock은 2026-10-30부터
  #   pyproject의 override-dependencies로 4.2.1 이상이라(cached-path의 filelock<4.0을 덮음) 2026-10-24에 제외했던
  #   CVE 3개를 목록에서 뺐다
  # - 목록 하나나 데이터베이스 하나가 실패해도 나머지를 끝까지 대조해 로그에 남긴 뒤 한 번에 실패시킨다(아래
  #   status). shell: bash는 pipefail을 켜서 내보내기나 grep이 실패하면 빈 목록으로 지나가지 않고 바로 멈춘다.
  #   소켓 제한 시간은 60초다(--timeout): 기본 15초에서는 2026-11-07의 한 실행이 pypi.org 응답을 기다리다 끊겨 권고가
  #   없는데도 실패로 끝났다
  # - npm은 배포되는 의존성과 개발 도구를 함께 본다(moderate 이상). Python 단계가 실패해도 돌게 해(`!cancelled()`)
  #   두 결과가 따로 남는다(전에는 Python 실패 뒤 건너뛰어 npm 결과가 기록되지 않았다)
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Audit every locked Python package
        working-directory: backend
        shell: bash
        run: |
          export_locked() {
            uv export --locked --no-hashes --no-annotate --format requirements-txt --no-emit-project "$@"
          }
          # 두 환경을 합쳐 패키지 줄만 남기고(첫 글자가 영문·숫자), MeloTTS와 transformers 4.27.4를 빼고, 환경 표지와
          # 로컬 판 표시를 떼고, 두 환경에 같은 판으로 든 패키지를 하나로 합친다(sort -u). 두 내보내기 중 하나가
          # 실패하면 그룹 전체가 실패해(&&) pipefail로 단계가 멈춘다.
          { export_locked --group gpu --group tts --no-group dev \
              && export_locked --group gpu --group eval --group dev; } \
            | grep -E '^[A-Za-z0-9]' \
            | grep -v -e '^melotts @ git' -e '^transformers==4\.27\.4' \
            | sed -E -e 's/[[:space:]]*;.*$//' -e 's/\+[^[:space:]]*$//' \
            | sort -u > "$RUNNER_TEMP/pinned.txt"
          locked=$(grep -c '^\[\[package\]\]' uv.lock)
          exported=$(wc -l < "$RUNNER_TEMP/pinned.txt")
          echo "uv.lock packages: $locked; audited (name, version) pairs: $exported (left out: the project, melotts, transformers 4.27.4)"
          test "$exported" -eq "$((locked - 3))"
          # 같은 이름의 둘째 판부터는 다음 목록으로(이름은 PyPI 규칙대로 소문자, -·_·.은 - 하나로 본다).
          awk -F'==' -v dir="$RUNNER_TEMP" '{
            name = tolower($1); gsub(/[-_.]+/, "-", name)
            print > (dir "/audit-" (++seen[name]) ".txt")
          }' "$RUNNER_TEMP/pinned.txt"
          status=0
          for list in "$RUNNER_TEMP"/audit-*.txt; do
            for service in pypi osv; do
              echo "== $(basename "$list"): $(wc -l < "$list") packages, $service"
              uvx pip-audit==2.10.1 -r "$list" --no-deps --disable-pip --strict --progress-spinner off --timeout 60 \
                -s "$service" \
                --ignore-vuln PYSEC-2026-3740 --ignore-vuln GHSA-j456-xh4h-cpf2 \
                --ignore-vuln PYSEC-2026-3447 --ignore-vuln GHSA-xmj3-9gf7-h52w \
                --ignore-vuln PYSEC-2025-194 || status=1
            done
          done
          exit "$status"

      - uses: actions/setup-node@v7
        if: ${{ !cancelled() }}
        with:
          node-version: 24

      - name: Audit the npm dependencies
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npm audit --audit-level=moderate
