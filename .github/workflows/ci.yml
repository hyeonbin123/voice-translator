name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vtuser
          POSTGRES_PASSWORD: vtpass
          POSTGRES_DB: voicetranslator
        ports:
          - 55442:5432
        options: >-
          --health-cmd "pg_isready -U vtuser -d voicetranslator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      UV_PYTHON: "3.11"
      DATABASE_URL: postgresql+asyncpg://vtuser:vtpass@127.0.0.1:55442/voicetranslator
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no floating major tag, so pin the exact release.
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      # --locked, as the image build (backend/Dockerfile) uses: fails when uv.lock is out of date with
      # pyproject.toml instead of testing the old locked versions.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

      # The plain run skips these modules: they need sacrebleu and jiwer from the eval group, which also
      # brings torch. Add only those two, at their locked versions, so these tests run too (T88).
      - name: Test the evaluation tools that need sacrebleu and jiwer
        run: >-
          uv run --with sacrebleu==2.6.0 --with jiwer==4.0.0
          pytest -q -rs tests/test_mt_decide.py tests/test_significance_corpus.py tests/test_reanalysis.py

      - name: Migrate development database
        run: uv run alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
