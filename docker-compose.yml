services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vtuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vtpass}
      POSTGRES_DB: ${POSTGRES_DB:-voicetranslator}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Windows (Hyper-V/WSL) can reserve host ports 5432-5631, so the default sits outside
      # that range. Override with POSTGRES_HOST_PORT; DATABASE_URL must use the same port.
      - "${POSTGRES_HOST_PORT:-55442}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vtuser}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
