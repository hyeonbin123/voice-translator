# The whole service: database, API with the real models on the GPU, and the built screen.
#   docker compose up --build        then open http://localhost:8080 (WEB_HOST_PORT)
# The first start downloads the Whisper, MeloTTS and Kokoro weights into the hfcache volume (a few GB) and
# loads them (about a minute). The translation models come from data/models/ct2 (eval/mt_convert.py).
# For local development, `docker compose up -d db` starts only the database (README).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vtuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vtpass}
      POSTGRES_DB: ${POSTGRES_DB:-voicetranslator}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Windows (Hyper-V/WSL) can reserve host ports 5432-5631, so the default sits outside
      # that range. Override with POSTGRES_HOST_PORT; DATABASE_URL must use the same port.
      # Only this machine can reach it: without a host address Docker listens on every network
      # interface, and the database would take the example password from anywhere the firewall allows.
      # Set POSTGRES_HOST_IP=0.0.0.0 only on purpose, with a real password.
      - "${POSTGRES_HOST_IP:-127.0.0.1}:${POSTGRES_HOST_PORT:-55442}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vtuser}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s  # a cold start on a slow disk (HDD) can outlast the retries above

  # Typo correction for typed English (T32): the API pulls its small LLM into the ollama volume on the
  # first start (about 1 GB, in the background) and keeps it loaded on the GPU (about 1.3 GB).
  ollama:
    image: ollama/ollama:0.34.0
    volumes:
      - ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    # Optional .env: JWT_SECRET_KEY keeps users signed in across restarts. DATABASE_URL below wins.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vtuser}:${POSTGRES_PASSWORD:-vtpass}@db:5432/${POSTGRES_DB:-voicetranslator}
      OLLAMA_URL: http://ollama:11434
    volumes:
      - ./data/models/ct2:/models/ct2:ro
      - hfcache:/models/hf
      - audio:/data/audio
    depends_on:
      db:
        condition: service_healthy
      # Typo correction is optional: the API starts without Ollama and translates typed text as is
      # until the model is ready (T37).
      ollama:
        condition: service_started
        required: false
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 900s  # the first start downloads and loads the models

  web:
    build: ./frontend
    ports:
      - "${WEB_HOST_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  hfcache:
  audio:
  ollama:
