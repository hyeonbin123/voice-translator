server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # A server-level types block replaces the inherited table, so include it here.
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }

    # Leave room for multipart headers around the API's 10 MiB file limit.
    client_max_body_size 11m;

    # Resolve Compose service names at request time; cache addresses for 10 seconds.
    resolver 127.0.0.11 valid=10s;

    # Compose must name the backend service api.
    location = /api/translate/live {
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        set $api_upstream api:8000;
        # A variable proxy_pass uses its URI verbatim: keep /api, escaping and the query string.
        proxy_pass http://$api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
