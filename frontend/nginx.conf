# 배포 이미지의 nginx 설정(frontend/Dockerfile이 /etc/nginx/conf.d/default.conf로 넣는다). 빌드한 화면 파일을
# 내주고, /api 요청과 동시통역 웹소켓을 API 컨테이너로 넘긴다. src/test/nginx.test.ts가 이 파일의 계약 줄을
# 글자로 확인한다.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # server 단계에 types 블록을 쓰면 물려받던 MIME 표 전체가 바뀌므로 표를 여기서 다시 include한다. 그 위에
    # .mjs를 자바스크립트로 더한다(onnxruntime-web의 WASM 로더가 .mjs라, 다른 형식으로 오면 브라우저가 모듈을
    # 거부해 대화 모드가 준비되지 않는다).
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }

    # 오류 페이지와 Server 머리글에 nginx 판 번호를 싣지 않는다(공격자가 알려진 취약점을 고르는 단서를 줄인다).
    server_tokens off;

    # API의 10MiB 파일 한도에 multipart 머리글 여유를 더한 값.
    client_max_body_size 11m;

    # Compose 서비스 이름(api)을 요청 때마다 다시 찾고, 주소는 10초 동안 기억한다.
    resolver 127.0.0.11 valid=10s;

    # 압축. 대화 모드가 처음 한 번 받는 onnxruntime-web WASM(약 14MB)이 gzip으로 약 3.7MB가 된다(5단계에서
    # 26%). 자바스크립트·CSS도 약 30%로 준다. Silero 모델(.onnx, application/octet-stream)은 86%로 거의 줄지
    # 않아 넣지 않는다. text/html은 nginx가 늘 압축한다. 1KB보다 작은 응답은 압축 비용이 이득보다 커 그대로
    # 보낸다. API의 JSON 응답(gzip_proxied any)도 같은 기준으로 압축하고, 번역 음성(audio/wav)은 넣지 않는다.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css text/plain application/javascript application/json application/wasm image/svg+xml;

    # 보안 머리글. 모든 응답(오류 포함, always)에 붙인다. location이 자기 add_header(캐시 등)를 가져도 여기 값을
    # 잃지 않게 add_header_inherit merge로 합친다(nginx 1.29.3부터. 기본 동작은 location에 add_header가 하나라도
    # 있으면 server 단계 값을 모두 버린다). docs/security.md에 각 값을 고른 이유와 확인 결과가 있다.
    # - Content-Security-Policy: 화면이 실제로 쓰는 출처만 허용한다. 모든 스크립트·스타일·WASM·모델·워클릿은 같은
    #   출처의 해시 붙은 파일이고, 실행 중에 CDN이나 외부 서버로 나가지 않는다(src/conversation/assets/SOURCE.md).
    #   'wasm-unsafe-eval'은 onnxruntime-web이 WebAssembly를 컴파일하는 데만 필요하다(일반 eval은 여전히 막힘).
    #   media-src blob:은 번역 음성을 인증 요청으로 받아 blob URL로 재생하기 때문이다. connect-src 'self'는
    #   API와 같은 출처 웹소켓(ws:)도 덮는다. 인라인 스크립트·인라인 스타일·data: 스크립트는 허용하지 않으므로,
    #   XSS로 스크립트를 끼워 넣어도 실행되기 어렵다(sessionStorage의 refresh 토큰을 빼 가는 공격을 막는 주 장치)
    # - frame-ancestors 'none'과 X-Frame-Options: 다른 사이트가 이 화면을 iframe에 넣지 못하게(클릭재킹)
    # - Permissions-Policy: 마이크는 이 출처만, 쓰지 않는 기능(카메라·위치·결제·USB 등)은 모두 끈다
    # - X-Content-Type-Options nosniff: 브라우저가 MIME을 추측해 다른 형식으로 실행하지 않게
    # - Referrer-Policy no-referrer: 다른 곳으로 나갈 때 주소를 보내지 않는다(외부 링크는 README 밖에 없다)
    # - Cross-Origin-Opener-Policy·Cross-Origin-Resource-Policy same-origin: 다른 출처 창과 브라우징 맥락을
    #   나누고, 이 서버의 파일을 다른 출처 페이지가 끌어다 쓰지 못하게
    # HSTS는 넣지 않는다: 기본 배포는 같은 PC의 HTTP(8080)이고, HTTPS 앞단을 둘 때 그쪽에서 정한다.
    add_header_inherit merge;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self'; media-src 'self' blob:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), midi=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # 동시통역·로그인한 대화 모드·두 사람 대화의 웹소켓. Compose의 API 서비스 이름은 api여야 한다.
    # HTTP/1.1 업그레이드 머리글을 넘기고, 한 연결을 길게 쓰므로 읽기 제한을 1시간으로 둔다.
    location = /api/translate/live {
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        set $api_upstream api:8000;
        # 변수를 쓴 proxy_pass는 URI를 그대로 쓴다: /api, 이스케이프, 쿼리 문자열을 지킨다.
        proxy_pass http://$api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # 빌드가 내용 해시를 이름에 붙인 파일들(index-<해시>.js, ort-wasm-simd-threaded-<해시>.wasm 등). 내용이 바뀌면
    # 이름이 바뀌므로 1년 동안 다시 묻지 않고 캐시하게 한다(immutable). 없는 파일은 화면 HTML 대신 404로 답한다.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 예외: 라이선스 원문 두 개는 해시 없이 늘 같은 이름이라(vite.config.ts) 장기 캐시하지 않는다. 정규식
    # location이 위의 접두어 location보다 먼저 고려된다.
    location ~ ^/assets/[A-Z]+-LICENSE\.txt$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    # 그 밖의 경로(/history 등)는 index.html을 돌려줘 화면 경로를 React Router에 맡긴다. index.html은 매번 새로
    # 확인하게 해(no-cache) 배포 뒤 새 해시 파일 이름을 바로 받게 한다.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
